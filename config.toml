# dualsense-xplane configuration
# Copy/edit this next to the binary, or pass a path as the first CLI arg:
#   ./dualsense-xplane /path/to/config.toml

# IP/port X-Plane 12 is listening on for UDP dataref requests.
# 127.0.0.1 if X-Plane runs on the same machine as this daemon.
xplane_ip = "127.0.0.1"
xplane_port = 49000

# Local UDP port this daemon binds to receive RREF responses.
# NOTE: X-Plane itself binds a wide range of UDP ports on startup (multiplayer,
# # BECN discovery, etc). If you get "Address already in use", check
# `sudo lsof -i UDP | grep -i main` for X-Plane's claimed ports and pick
# something outside that range.
local_port = 52010

# "bluetooth" | "usb" | "auto"
# Bluetooth is prioritized per project scope; falls back to whatever hidapi
# finds if the preferred transport isn't present. "auto" just takes the
# first DualSense found, whichever transport it's on.
connection = "bluetooth"

# Optional: force the stall angle of attack (degrees). Leave commented out to
# use each aircraft's own stall-warning AoA (acf_stall_warn_alpha), falling
# back to 14 degrees if the aircraft doesn't define one.
# stall_alpha_deg = 14.0

# Effect mixer tick rate. 60 Hz matches typical HID polling; the DualSense's
# actuators can't usefully resolve much faster than this anyway.
tick_hz = 60

[gains]
ground_rumble = 0.35   # runway/taxiway rumble, scales with groundspeed (silent below ~6kt)
touchdown = 1.0        # one-shot thump on touchdown, scales with VS + g-spike
stall_buffet = 0.8     # buffet only within ~2deg of stall AoA, or stall-warning active
turbulence = 0.5       # g_nrml deviation from 1.0, with a deadband for normal sim jitter
overspeed = 0.9        # discrete buzz when over_vne is active
gear_flap = 0.4        # bump on gear/flap position change
engine_rumble = 0.0    # OFF by default -- constant idle hum reads as "broken controller,"
                       # not immersive. Set > 0 only if you specifically want it; it's
                       # gated to N1 > 60% so it won't hum at idle even when enabled.
speedbrake_buffet = 0.5  # spoiler/speedbrake buffet, deployment x airspeed^2
surface_rough = 0.35   # extra irregular bumps on grass/dirt/gravel; hull slap on water
gear_buffet = 0.25     # airframe rumble with gear down in flight, scales with airspeed
engine_start = 0.6     # one-shot shove on engine light-off, softer shudder on shutdown
rotor_beat = 0.25      # helicopters only: pulses at the main rotor's once-per-rev rate
prop_beat = 0.0        # fixed-wing prop hum, OFF by default (same reason as engine_rumble)
ap_disconnect = 0.6    # double tap when the autopilot servos disengage
config_overspeed = 0.6 # pulsing buzz when over flap (Vfe) or gear (Vle) limit speed
nose_touchdown = 0.6   # lighter thump when the nose/tail wheel comes down after the mains

# Adaptive triggers. Zones are trigger travel: 0 = released, 9 = fully pulled.
# Detents only line up with throttle settings if R2 is bound to the throttle
# axis (and L2 to brakes) in X-Plane's joystick settings.
[triggers]
enabled = true                # master switch; false = never touch the triggers
throttle = true               # R2: light resistance, then a resistance step (detent)
throttle_detent_zone = 8      # 1-9, where the detent starts (8 ~ climb/TOGA gate)
throttle_detent_strength = 6  # 1-8, resistance past the detent
reverse_buzz = true           # R2 buzzes while thrust reversers are deployed
brakes = true                 # L2: firmer with groundspeed, locked with parking brake set
stall_shaker = true           # both triggers shake on stall warning
stall_shaker_hz = 20
