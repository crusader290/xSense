[package]
name = "dualsense-xplane"
version = "0.2.2"
edition = "2021"
description = "X-Plane 12 -> DualSense haptics daemon for Linux and Windows (rumble, adaptive triggers, lightbar)"
authors = ["Abdullah Waqar"]

[[bin]]
name = "dualsense-xplane"
path = "src/main.rs"

[dependencies]
hidapi = { version = "2.6", default-features = false }
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
toml = "0.5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"

# Per-platform HID backends. Linux talks to hidraw directly; Windows uses
# hidapi's pure-Rust native backend (no C toolchain needed, and it always
# sizes WriteFile buffers to the device's OutputReportByteLength).
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[profile.release]
opt-level = 2
